<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Energy Flow Tree Card · vista previa</title>
  <style>
    body { margin: 0; padding: 20px; background: #111; color: #e1e1e1; font-family: Roboto, system-ui, sans-serif;
           --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --card-background-color: #1c1c1c;
           --secondary-background-color: #262626; --divider-color: #444; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
    .phone { width: 400px; } .desk { width: 620px; }
    ha-card { display: block; background: var(--card-background-color); border-radius: 12px; }
    p { color: #9b9b9b; font-size: 13px; }
  </style>
</head>
<body>
  <p>Datos simulados que cambian cada 3 s (casa entre 0,3 y 4 kW). Izquierda: ancho de móvil; derecha: escritorio.</p>
  <div class="row"><div class="phone" id="a"></div><div class="desk" id="b"></div></div>
  <script type="module">
    import "./dist/energy-flow-tree-card.js";
    const CONFIG = {
      type: "custom:energy-flow-tree-card", title: "Solar",
      grid: { import: "sensor.grid_importacion", export: "sensor.grid_exportacion" },
      battery: { discharge: "sensor.bateria_descarga", charge: "sensor.bateria_carga", soc: "sensor.soc" },
      solar: { entity: "sensor.pv", secondary: "sensor.t_ext" }, home: { entity: "sensor.casa", secondary: "sensor.t_int" },
      eco: { fossil: "sensor.fosil" }, produced_today: "sensor.pv_hoy",
      forecast: { today: "sensor.prev_hoy", tomorrow: "sensor.prev_manana" },
      tree: [
        { entity: "sensor.subcuadro", name: "Subcuadro", color: "#a1887f", children: [
          { entity: "sensor.acs", name: "ACS", color: "#64b5f6" }, { entity: "sensor.jacuzzi", name: "Jacuzzi", color: "#f06292" },
          { entity: "sensor.bomba", name: "Bomba", color: "#ffd54f" }, { entity: "sensor.acs2", name: "ACS 2", color: "#4fc3f7" },
          { entity: "sensor.piscina", name: "Piscina", color: "#4dd0e1" } ] },
        { entity: "sensor.aero", name: "Aerotermia", color: "#e57373" }, { entity: "sensor.cocina", name: "Cocina", color: "#ffb74d" },
        { entity: "sensor.despacho", name: "Despacho", color: "#9575cd" }, { entity: "sensor.domotica", name: "Domótica", color: "#81c784" },
      ],
    };
    const st = (v, u = "W") => ({ state: String(v), attributes: { unit_of_measurement: u } });
    function hass(t) {
      const r = (a, b) => Math.round(a + (b - a) * (0.5 + 0.5 * Math.sin(t)));
      const acs = r(0, 1800), pis = r(0, 600), jac = r(20, 1400), bomba = r(0, 80);
      const sub = acs + pis + jac + bomba + r(0, 60);
      const aero = r(150, 900), coc = Math.max(0, r(-800, 2500)), desp = r(200, 400), dom = r(100, 130);
      const casa = sub + aero + coc + desp + dom + r(50, 300);
      const pv = Math.max(0, r(-500, 6000));
      const charge = Math.max(0, Math.min(2000, pv - casa)), export_ = Math.max(0, pv - casa - charge);
      const dis = Math.max(0, casa - pv);
      return { states: {
        "sensor.casa": st(casa), "sensor.pv": st(pv), "sensor.grid_importacion": st(Math.max(0, r(-1500, 1500))), "sensor.grid_exportacion": st(export_),
        "sensor.bateria_carga": st(charge), "sensor.bateria_descarga": st(dis), "sensor.soc": st(r(40, 98), "%"),
        "sensor.fosil": st(18, "%"), "sensor.t_ext": st(19.4, "°C"), "sensor.t_int": st(24.2, "°C"),
        "sensor.pv_hoy": st(18.4, "kWh"), "sensor.prev_hoy": st(42.04, "kWh"), "sensor.prev_manana": st(20.52, "kWh"),
        "sensor.subcuadro": st(sub), "sensor.acs": st(acs), "sensor.jacuzzi": st(jac), "sensor.bomba": st(bomba), "sensor.acs2": st(0),
        "sensor.piscina": st(pis), "sensor.aero": st(aero), "sensor.cocina": st(coc), "sensor.despacho": st(desp), "sensor.domotica": st(dom),
      } };
    }
    const cards = ["a", "b"].map((id) => {
      const c = document.createElement("energy-flow-tree-card");
      c.setConfig(CONFIG); c.hass = hass(0); document.getElementById(id).appendChild(c); return c;
    });
    let t = 0;
    setInterval(() => { t += 0.7; cards.forEach((c) => (c.hass = hass(t))); }, 3000);
  </script>
</body>
</html>
